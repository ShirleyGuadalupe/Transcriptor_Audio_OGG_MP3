<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcriptor de audios</title>
<style>
:root{--bg:#fdf0f7;--card:#fff;--tx:#2a1b24;--mu:#8a6b7c;--bd:#f6cfe3;--ac:#db2777;--onac:#fff;--ok:#15803d;--er:#b91c1c;--sel:#fde4f0}
@media (prefers-color-scheme:dark){:root{--bg:#1c1218;--card:#271a22;--tx:#f5e8ef;--mu:#c3a3b4;--bd:#47283b;--ac:#f472b6;--onac:#2a0f1e;--ok:#4ade80;--er:#f87171;--sel:#4a2340}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif}
.app{max-width:1200px;margin:0 auto;padding:12px 16px;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;color:var(--ac)}
.hint{color:var(--mu);font-size:13px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;min-height:0;gap:8px;overflow:hidden}
.panel h2{font-size:13px;margin:0;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
#drop{border:2px dashed var(--bd);border-radius:10px;padding:16px 12px;text-align:center;color:var(--mu);cursor:pointer;font-size:14px}
#drop.over,#drop:hover{border-color:var(--ac);color:var(--ac)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}
button:disabled{opacity:.45;cursor:default}
.st{font-size:12px;color:var(--mu)}
.bar{height:5px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.bar.ind i{width:35%;animation:mv 1.1s ease-in-out infinite alternate}
@keyframes mv{from{margin-left:0}to{margin-left:65%}}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:80px}
.file{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;cursor:pointer}
.file:hover{border-color:var(--ac)}
.file.sel{background:var(--sel);border-color:var(--ac)}
.fn{font-size:14px;word-break:break-all}
.fs{font-size:12px;color:var(--mu)}.fs.done{color:var(--ok)}.fs.error{color:var(--er)}.fs.run{color:var(--ac)}
#ph{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:20px}
#det{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
#dname{font-weight:600;word-break:break-all}
audio{width:100%;height:36px}
#ta{flex:1;min-height:120px;width:100%;resize:none;line-height:1.55;font-size:15px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){.grid{grid-template-columns:1fr}body,html{height:auto}.app{height:auto}.panel{overflow:visible}#list{max-height:220px}#ta{min-height:260px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Transcriptor de audios</h1>
    <span class="hint">OGG (WhatsApp) y MP3 · sin límites</span>
  </header>

  <div class="grid">
    <section class="panel">
      <h2>Audios</h2>
      <div id="drop">Arrastra aquí los audios o haz clic para elegirlos
        <input id="file" type="file" accept=".ogg,.opus,.mp3,.m4a,.wav,audio/*" multiple hidden>
      </div>
      <div class="tools">
        <label class="st">Idioma
          <select id="lang">
            <option value="spanish" selected>Español</option>
            <option value="auto">Automático</option>
            <option value="english">Inglés</option>
            <option value="portuguese">Portugués</option>
          </select>
        </label>
        <span style="flex:1"></span>
        <button id="copyAll" disabled>Copiar todo</button>
        <button id="clear" disabled>Limpiar</button>
      </div>
      <div>
        <div class="st" id="mst">El modelo se descarga al transcribir el primer audio.</div>
        <div class="bar" id="mbarw"><i id="mbar"></i></div>
      </div>
      <div id="list"></div>
    </section>

    <section class="panel">
      <h2>Transcripción</h2>
      <div id="ph">Sube un audio y su transcripción aparecerá aquí.</div>
      <div id="det" hidden>
        <div id="dname"></div>
        <audio id="player" controls preload="metadata"></audio>
        <div><div class="st" id="dstat"></div><div class="bar ind" id="work" hidden><i></i></div></div>
        <textarea id="ta" disabled placeholder="Aquí aparecerá el texto. Podrás corregirlo antes de copiarlo."></textarea>
        <div class="actions">
          <button id="copy" class="p" disabled>Copiar texto</button>
          <button id="dl" disabled>Descargar .txt</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script type="module">
const MODEL = 'Xenova/whisper-base';
const $ = s => document.querySelector(s);
const LABEL = { queue: 'En cola', run: 'Transcribiendo…', done: 'Listo', error: 'Error' };
let items = [], sel = null, busy = false, asr = null, tf = null, device = 'CPU', nid = 0;

window.addEventListener('unhandledrejection', e => { $('#mst').innerHTML = `<span style="color:var(--er)">Error: ${e.reason?.message || e.reason}</span>`; });

/* ---------- entrada de archivos ---------- */
const drop = $('#drop'), fileIn = $('#file');
drop.onclick = () => fileIn.click();
fileIn.onchange = () => { add(fileIn.files); fileIn.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); };

function add(files) {
  for (const f of files) items.push({ id: ++nid, f, url: URL.createObjectURL(f), status: 'queue', text: '', msg: '' });
  if (!sel && items.length) sel = items[0];
  renderList(); renderDetail(); run();
}

/* ---------- interfaz ---------- */
function renderList() {
  const L = $('#list'); L.textContent = '';
  for (const it of items) {
    const d = document.createElement('div'); d.className = 'file' + (it === sel ? ' sel' : '');
    const n = document.createElement('div'); n.className = 'fn'; n.textContent = it.f.name;
    const s = document.createElement('div'); s.className = 'fs ' + it.status;
    s.textContent = LABEL[it.status] + (it.status === 'error' && it.msg ? ': ' + it.msg : '');
    d.append(n, s);
    d.onclick = () => { sel = it; renderList(); renderDetail(); };
    L.append(d);
  }
  $('#clear').disabled = !items.length;
  $('#copyAll').disabled = !items.some(i => i.status === 'done');
}

function renderDetail() {
  const it = sel, has = !!it;
  $('#ph').hidden = has; $('#det').hidden = !has;
  if (!has) return;
  $('#dname').textContent = it.f.name;
  const pl = $('#player');
  if (pl.dataset.id !== String(it.id)) { pl.dataset.id = it.id; pl.src = it.url; }
  const ta = $('#ta');
  if (ta.dataset.id !== String(it.id) || ta.dataset.st !== it.status) {
    ta.dataset.id = it.id; ta.dataset.st = it.status; ta.value = it.text;
  }
  ta.disabled = it.status !== 'done';
  $('#work').hidden = it.status !== 'run';
  $('#dstat').textContent = it.status === 'queue' ? 'En cola, esperando su turno…'
    : it.status === 'run' ? 'Transcribiendo…'
    : it.status === 'error' ? 'Error: ' + it.msg
    : (it.info || 'Listo. Puedes corregir el texto antes de copiarlo.');
  $('#copy').disabled = $('#dl').disabled = it.status !== 'done';
}

$('#ta').oninput = e => { if (sel) sel.text = e.target.value; };

async function copy(text, btn, label) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  btn.textContent = 'Copiado ✓'; setTimeout(() => btn.textContent = label, 1500);
}
const download = (name, text) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#copy').onclick = e => copy(sel.text, e.target, 'Copiar texto');
$('#dl').onclick = () => download(sel.f.name.replace(/\.[^.]+$/, '') + '.txt', sel.text);
$('#copyAll').onclick = e => copy(items.filter(i => i.status === 'done').map(i => `${i.f.name}\n${i.text}`).join('\n\n'), e.target, 'Copiar todo');
$('#clear').onclick = () => {
  items.forEach(i => URL.revokeObjectURL(i.url));
  items = []; sel = null; $('#player').removeAttribute('src'); $('#player').dataset.id = '';
  renderList(); renderDetail();
};

/* ---------- modelo ---------- */
async function loadModel() {
  if (asr) return;
  const st = $('#mst'), bar = $('#mbar');
  st.textContent = 'Cargando librería…';
  try { tf = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2'); }
  catch { throw new Error('No se pudo cargar la librería desde cdn.jsdelivr.net (puede estar bloqueada por la red)'); }
  tf.env.backends.onnx.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 1);
  const files = {};
  const cb = p => {
    if (p.status !== 'progress') return;
    files[p.file] = p.progress;
    const v = Object.values(files), avg = v.reduce((a, b) => a + b, 0) / v.length;
    bar.style.width = avg + '%'; st.textContent = `Descargando modelo (solo la primera vez)… ${avg.toFixed(0)}%`;
  };
  st.textContent = 'Descargando modelo (solo la primera vez)…';
  try {
    if (!navigator.gpu) throw 0;
    asr = await tf.pipeline('automatic-speech-recognition', MODEL, { device: 'webgpu', dtype: { encoder_model: 'fp32', decoder_model_merged: 'q4' }, progress_callback: cb });
    device = 'GPU';
  } catch {
    try { asr = await tf.pipeline('automatic-speech-recognition', MODEL, { dtype: 'q8', progress_callback: cb }); device = 'CPU'; }
    catch (e) { throw new Error('No se pudo descargar el modelo desde huggingface.co (' + (e.message || e) + ')'); }
  }
  bar.style.width = '100%';
  st.textContent = `Modelo listo (${device === 'GPU' ? 'usando tarjeta gráfica' : 'usando procesador'}).`;
}

/* ---------- audio ---------- */
async function decode(file) {
  const ctx = new AudioContext({ sampleRate: 16000 });
  try {
    const buf = await ctx.decodeAudioData(await file.arrayBuffer());
    if (buf.numberOfChannels === 1) return buf.getChannelData(0).slice();
    const a = buf.getChannelData(0), b = buf.getChannelData(1), out = new Float32Array(a.length);
    for (let i = 0; i < a.length; i++) out[i] = (a[i] + b[i]) / 2;
    return out;
  } finally { ctx.close(); }
}

/* ---------- cola ---------- */
async function run() {
  if (busy) return;
  busy = true;
  let it;
  while ((it = items.find(i => i.status === 'queue'))) {
    it.status = 'run'; renderList(); if (sel === it) renderDetail();
    try {
      await loadModel();
      let audio = await decode(it.f);
      const dur = audio.length / 16000, t0 = performance.now(), lang = $('#lang').value;
      const out = await asr(audio, { chunk_length_s: 30, stride_length_s: 5, task: 'transcribe', ...(lang !== 'auto' ? { language: lang } : {}) });
      audio = null;
      it.text = out.text.trim();
      it.info = `Listo: ${dur.toFixed(0)} s de audio en ${((performance.now() - t0) / 1000).toFixed(1)} s. Puedes corregir el texto antes de copiarlo.`;
      it.status = 'done';
    } catch (e) {
      console.error(e);
      it.status = 'error';
      it.msg = e.message || String(e);
    }
    renderList(); if (sel === it) renderDetail();
    await new Promise(r => setTimeout(r, 0));
  }
  busy = false;
}
</script>
</body>
</html>
